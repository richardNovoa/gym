[build]
  command = "npm run build"
  publish = "dist"

# Public client config. Vite inlines these at build time.
# A value set in the Netlify UI overrides the same name here.
[build.environment]
  VITE_SUPABASE_URL = "https://xgnhxfiyffffyvhwusmh.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hUTOc_xA19jPcp7eyF4iMQ_U6wCisvG"

# SPA fallback. Vite has no /api server; this does not proxy anywhere.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
